source: >-
  npm registry metadata endpoints (https://registry.npmjs.org/@outfront%2f<pkg>) for every
  package published under the @outfront npm scope; cross-checked against the GitHub
  organizations that carry the OUTFRONT name.
summary:
  registries_searched: [npm, pypi, rubygems, crates.io, nuget, maven-central, pkg.go.dev, packagist]
  registries_with_hits: [npm]
  package_count: 9
  api_client_count: 0
  sdk_count: 0
note: >-
  OUTFRONT Media publishes NO API client libraries or SDKs, because it publishes no public
  API. What DOES exist is a first-party npm scope — @outfront — carrying nine MIT-licensed
  packages that are internal front-end build dependencies for OUTFRONT's own web
  applications ("onsmart" = OUTFRONT ON Smart Media, the company's ad-tech platform). They
  are React UI kits, a map component library, an auth-client wrapper, a forms library, a
  Create React App fork, and two OpenSearch operations tools. None of them wraps a public
  OUTFRONT API and none is documented for external consumers, so NO `SDKs` pointer is
  emitted in apis.yml — emitting one would credit OUTFRONT with API client libraries it
  does not ship. Only the neutral `Packages` pointer is wired.
ownership_note: >-
  Judged first-party on three signals rather than on the registry name alone: (1) the scope
  is @outfront; (2) every package README embeds the OUTFRONT primary logo
  (beakyn-ui.s3.amazonaws.com/OUT_PRIMARY_LOGO_POS_RGB_BLACK_PILL.svg); (3) the source repos
  are named for OUTFRONT's own product, "onsmart" (OUTFRONT ON Smart Media). The publishing
  maintainers are jeff.frank, markd_om and hileo.beakyn, and the git repositories sit under
  github.com/Beakyn — Beakyn is the development studio that builds the ON Smart Media
  front end for OUTFRONT (beakyn.com no longer resolves). The packages are therefore
  vendor-authored but OUTFRONT-scoped and OUTFRONT-branded; they are recorded as official
  and explicitly as non-client-library.

